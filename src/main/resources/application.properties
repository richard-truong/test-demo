spring.application.name=test-demo

# ---- MCP server -------------------------------------------------------------
spring.ai.mcp.server.name=user-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.instructions=Tools to create, read, update and delete users.
spring.ai.mcp.server.type=SYNC
# STREAMABLE -> POST/GET on /mcp   (use SSE if your client only speaks the old protocol)
spring.ai.mcp.server.protocol=STREAMABLE

# ---- Loopback to this app's own REST API ------------------------------------
# The MCP tools are a wrapper: they call /users over HTTP like any other client.
app.user-api.base-url=http://localhost:8080
